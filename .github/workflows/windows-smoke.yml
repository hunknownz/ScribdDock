name: Windows smoke
on:
  workflow_dispatch:
    inputs:
      live_download:
        description: Also download the public five-page Scribd sample
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm browser:install
      - run: pnpm test:browser
      - if: ${{ inputs.live_download }}
        run: pnpm test:live
        env:
          SCRIBD_TEST_URL: https://www.scribd.com/document/884183779/Sample-5-Page-PDF
          SCRIBD_TEST_EXPECTED_PAGES: '5'
          SCRIBD_TEST_REQUIRE_TEXT: '1'
      - if: ${{ inputs.live_download }}
        name: Check compiled CLI and independently extract PDF text
        run: |
          pnpm build
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
          python -m pip install pypdf==6.10.0
          if ($LASTEXITCODE -ne 0) { throw "PDF QA dependency installation failed" }
          $outputPath = Join-Path $env:RUNNER_TEMP "scribddock-public-five-page.pdf"
          try {
            node dist/cli.js download "https://www.scribd.com/document/884183779/Sample-5-Page-PDF" --guest -o $outputPath
            if ($LASTEXITCODE -ne 0) { throw "Compiled CLI download failed" }
            python scripts/verify-public-pdf.py $outputPath
            if ($LASTEXITCODE -ne 0) { throw "PDF text QA failed" }
          } finally {
            Remove-Item -LiteralPath $outputPath -Force -ErrorAction SilentlyContinue
          }
